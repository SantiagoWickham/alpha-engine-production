[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-engine-v12"
version = "0.1.0"
description = "Return-first, event-driven alpha research and execution engine"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "scipy>=1.14",
  "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
