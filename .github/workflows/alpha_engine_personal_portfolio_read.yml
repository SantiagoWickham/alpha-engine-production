name: Alpha Engine Personal Portfolio Read

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  personal-portfolio:

    runs-on: windows-latest

    steps:

      - name: Checkout production repository
        uses: actions/checkout@v6
        with:
          ref: main
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.3'

      - name: Read personal portfolio from Google Sheets
        shell: pwsh
        env:
          ALPHA_SHEET_WEBAPP_URL: ${{ secrets.ALPHA_SHEET_WEBAPP_URL }}
          ALPHA_SHEET_TOKEN: ${{ secrets.ALPHA_SHEET_TOKEN }}
        run: |
          python cloud/read_personal_portfolio.py

      - name: Build personal portfolio
        shell: pwsh
        run: |
          python cloud/build_personal_portfolio.py

      - name: Validate personal portfolio outputs
        shell: pwsh
        run: |
          if (!(Test-Path "PRODUCT/personal_portfolio.json")) {
            throw "MISSING personal_portfolio.json"
          }

          if (!(Test-Path "PRODUCT/personal_portfolio_positions.json")) {
            throw "MISSING personal_portfolio_positions.json"
          }

          if (!(Test-Path "PRODUCT/personal_portfolio_cash.json")) {
            throw "MISSING personal_portfolio_cash.json"
          }

          if (!(Test-Path "PRODUCT/personal_portfolio_snapshot.json")) {
            throw "MISSING personal_portfolio_snapshot.json"
          }

          Write-Host ""
          Write-Host "PERSONAL PORTFOLIO OUTPUT VALIDATION: PASS"

      - name: Save personal portfolio state
        shell: pwsh
        run: |
          git config user.name "alpha-engine-bot"
          git config user.email "alpha-engine-bot@users.noreply.github.com"

          git add `
            PRODUCT/personal_portfolio_ledger.json `
            PRODUCT/personal_portfolio.json `
            PRODUCT/personal_portfolio_positions.json `
            PRODUCT/personal_portfolio_positions.csv `
            PRODUCT/personal_portfolio_cash.json `
            PRODUCT/personal_portfolio_snapshot.json

          $changes = git status --porcelain

          if ($changes) {
            git commit -m "Update personal portfolio state"
            git push origin main
          }
          else {
            Write-Host "No personal portfolio changes."
          }
