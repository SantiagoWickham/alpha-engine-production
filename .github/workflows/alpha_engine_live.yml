name: Alpha Engine Live Forward

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "America/Argentina/Buenos_Aires"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: alpha-engine-live-forward
  cancel-in-progress: false

jobs:
  live:
    name: Run sealed Alpha Engine
    runs-on: windows-latest
    env:
      MMM_SEC_USER_AGENT: ${{ secrets.MMM_SEC_USER_AGENT }}
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository + Git LFS
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            ALPHA_ENGINE_V12_RETURN_FIRST_STARTER/requirements.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ".\ALPHA_ENGINE_V12_RETURN_FIRST_STARTER\requirements.txt"
          python -m pip install statsmodels openpyxl

      - name: Validate required secret
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MMM_SEC_USER_AGENT)) {
            throw "GitHub Actions secret MMM_SEC_USER_AGENT is missing."
          }
          Write-Host "SEC identity secret: CONFIGURED (value hidden)"

      - name: Restore V12 compatibility source alias
        shell: pwsh
        run: |
          $current = Join-Path $env:GITHUB_WORKSPACE "ALPHA_ENGINE_V12_RETURN_FIRST_STARTER"
          $legacyParent = "C:\Users\santi\OneDrive\Escritorio\ALPHA_ENGINE_V12_RETURN_FIRST"
          $legacy = Join-Path $legacyParent "ALPHA_ENGINE_V12_RETURN_FIRST_STARTER"
          $panel = Join-Path $current "outputs\phase2_canonical_pit_panel.parquet"
          $ret = Join-Path $current "outputs\phase2c_return_price_layer.parquet"

          if (-not (Test-Path $panel)) { throw "Missing canonical PIT panel after checkout/LFS." }
          if (-not (Test-Path $ret)) { throw "Missing return-price layer after checkout/LFS." }

          New-Item -ItemType Directory -Force -Path $legacyParent | Out-Null
          if (Test-Path -LiteralPath $legacy) {
            $item = Get-Item -LiteralPath $legacy -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              cmd.exe /c "rmdir `"$legacy`"" | Out-Null
            } else {
              Remove-Item -LiteralPath $legacy -Recurse -Force
            }
          }
          New-Item -ItemType Junction -Path $legacy -Target $current | Out-Null

          if (-not (Test-Path (Join-Path $legacy "outputs\phase2_canonical_pit_panel.parquet"))) {
            throw "Compatibility junction did not resolve."
          }
          Write-Host "V12 compatibility alias: PASS"

      - name: Snapshot sealed V13 hashes
        id: seal_before
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "ALPHA_ENGINE_V13_RETURN_FIRST_MULTI_HORIZON"
          $critical = @(
            "outputs\v13_phase2r_model_spec.json",
            "outputs\v13_phase2u_expert_evidence.csv",
            "outputs\v13_phase3aa_freeze_manifest.json",
            "outputs\v13_phase4_sealed_features.csv",
            "outputs\v13_phase4_model_seal_manifest.json",
            "outputs\v13_phase4_sealed_model_bundle.joblib"
          )
          $rows = foreach ($rel in $critical) {
            $p = Join-Path $root $rel
            if (-not (Test-Path $p)) { throw "Missing sealed artifact: $p" }
            [PSCustomObject]@{
              path = $rel
              sha256 = (Get-FileHash -Algorithm SHA256 $p).Hash
              bytes = (Get-Item $p).Length
            }
          }
          $rows | ConvertTo-Json -Depth 5 | Set-Content "$env:RUNNER_TEMP\seal_before.json" -Encoding UTF8
          Write-Host "SEALED SNAPSHOT PASS 6/6"

      - name: Run Phase5B live shadow
        shell: pwsh
        run: |
          & ".\ALPHA_ENGINE_V13_RETURN_FIRST_MULTI_HORIZON\RUN_V13_PHASE5B_LIVE_SHADOW.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "Phase5B runner failed."
          }

      - name: Rebuild forward NAV
        shell: pwsh
        run: |
          python ".\ALPHA_ENGINE_DATA_RECOVERY_V1\scripts\build_forward_nav_v42.py"
          if ($LASTEXITCODE -ne 0) {
            throw "Forward NAV builder failed."
          }

      - name: Verify sealed V13 unchanged
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "ALPHA_ENGINE_V13_RETURN_FIRST_MULTI_HORIZON"
          $before = Get-Content "$env:RUNNER_TEMP\seal_before.json" -Raw | ConvertFrom-Json
          foreach ($row in $before) {
            $p = Join-Path $root $row.path
            $after = (Get-FileHash -Algorithm SHA256 $p).Hash
            if ($after -ne $row.sha256) {
              throw "SEALED V13 MUTATION DETECTED: $($row.path)"
            }
          }
          Write-Host "SEALED VERIFY PASS 6/6 byte-identical"

      - name: Build read-only mobile snapshot + audit history
        shell: pwsh
        env:
          AE_TRIGGER: ${{ github.event_name }}
          AE_RUN_ID: ${{ github.run_id }}
          AE_RUN_ATTEMPT: ${{ github.run_attempt }}
          AE_COMMIT_SHA: ${{ github.sha }}
        run: |
          python ".\cloud\build_mobile_snapshot.py"

      - name: Persist safe live evidence to main
        shell: pwsh
        run: |
          git config user.name "alpha-engine-live"
          git config user.email "alpha-engine-live@users.noreply.github.com"

          git add -- `
            "cloud/history/runs.csv" `
            "cloud/history/decisions" `
            "mobile_snapshot"

          $pending = git diff --cached --name-only
          if ([string]::IsNullOrWhiteSpace(($pending -join "`n"))) {
            Write-Host "No new safe evidence to commit."
          } else {
            $summary = Get-Content ".\ALPHA_ENGINE_V13_RETURN_FIRST_MULTI_HORIZON\outputs\live_shadow\v13_live_shadow_summary.json" -Raw | ConvertFrom-Json
            $session = $summary.latest_completed_session
            git commit -m "Live forward $session [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "Live evidence commit failed." }

            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "Rebase before live evidence push failed." }

            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Live evidence push failed." }
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mobile snapshot for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile_snapshot

  deploy:
    name: Publish mobile snapshot
    needs: live
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
